[project]
name = "ed-finder"
version = "3.0.1"
description = "Elite Dangerous colonisation planner — searches 186M star systems by economy, body types, and distance."
requires-python = ">=3.14,<3.15"
classifiers = [
  "Programming Language :: Python :: 3.14",
]

# This file is the CPython 3.14 repository/tooling authority. The V3 API
# runtime lock remains apps/api/pyproject.toml + apps/api/uv.lock; services and
# tooling use their focused per-app requirements files. CI validates this
# authority directly on the integration head:
#
#   apps/api/requirements.txt        — API compatibility mirror (not V3 lock authority)
#   apps/importer/requirements.txt   — the Spansh pipelines
#
# To install everything the tests need:
#
#   pip install -r tests/requirements-ci.txt

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# S110 and S112: an error caught and then dropped without a word ("except:
# pass", "except: continue"). The code review of 15 November 2026 found that
# these were how the site failed quietly. One that is meant has to say why,
# beside it, with "# noqa: S110" and the reason.
select = ["B905", "E4", "E7", "E9", "F", "S110", "S112"]
# E701/E702 are accepted legacy one-line style, not defect-class findings.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Retained canonical source must stay byte-identical to its published run hash.
# Its unused Iterator import is harmless; new bridge code is linted normally.
"apps/importer/src/v3_spansh/pipeline.py" = ["F401"]
# Kept only because the frozen Ratings V4 record checks it by its contents
# (docs/development/ratings-v4-freeze/manifest.json); it must not be edited.
# The helper beside it is what it imports.
"apps/importer/src/build_ratings.py" = ["S110"]
"shared_contracts/bulk_update_helper.py" = ["S110"]
# A test file that borrows another test file's fixtures names each one twice:
# once in the import, once as the test's argument. That is how pytest
# fixtures are shared, not a mistake.
"tests/test_*.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Any warning fails the run, so warnings get fixed instead of piling up.
filterwarnings = [
    "error",
    # slowapi (the API's rate limiter) still calls asyncio.iscoroutinefunction,
    # which Python 3.14 deprecates and 3.16 removes. It is their code, raised
    # when the API routes are imported; replace or update slowapi before 3.16.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]
markers = [
    "unit: unit-level tests that do not require external services",
    "integration: integration tests that exercise cross-module or service boundaries",
    "db: tests that require a database contract or a live database",
    "operator: tests for operator scripts, operator APIs, and operator safety surfaces",
    "slow: tests that are expected to take longer than the default unit path",
    "e2e: browser or full-stack end-to-end tests",
    "frontend: frontend tests",
    "requires_docker: tests or preflights that require Docker",
    "requires_postgres: tests or preflights that require local Postgres",
    "requires_redis: tests or preflights that require Redis",
]
