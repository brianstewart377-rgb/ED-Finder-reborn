name: Images

# Builds the API and web images. On main they are published to GHCR as
#   ghcr.io/<owner>/<repo>/api:git-<commit>   and   :main
#   ghcr.io/<owner>/<repo>/web:git-<commit>   and   :main
# On a pull request they are only built and smoke-tested, never published.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/api/**
      - apps/web/**
      - packages/**
      - shared_contracts/**
      - assets/**
      - apps/importer/src/data/region_map.json
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile.release
            build_args: ""
          - name: web
            dockerfile: apps/web/Dockerfile
            # The Finder archetype screen is switched on in released builds.
            build_args: VITE_FINDER_F4_ENABLED=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the image name and commit
        id: meta
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}"
          {
            echo "sha=$sha"
            echo "repository=$repository"
            echo "exact=$repository:git-$sha"
            echo "moving=$repository:main"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            ${{ matrix.build_args }}
          tags: |
            ${{ steps.meta.outputs.exact }}
            ${{ steps.meta.outputs.moving }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Check the image says which commit it is
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.exact }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          [ "$label" = "$SHA" ] || { echo "image label is '$label', expected $SHA" >&2; exit 1; }

      - name: Smoke-test the API image
        if: matrix.name == 'api'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.exact }}
        run: |
          set -euo pipefail
          # Imports the whole application without a database. CORS_ORIGINS is
          # the one setting it refuses to start without.
          docker run --rm -e CORS_ORIGINS=https://example.test "$IMAGE" \
            python -c "import edfinder_api.main as m; assert m.app is not None; print('API imports cleanly')"
          docker run --rm "$IMAGE" python -c "import os; assert os.environ['BUILD_SHA'] == '${{ steps.meta.outputs.sha }}'"

      - name: Smoke-test the web image
        if: matrix.name == 'web'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.exact }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          docker run -d --name web-smoke -p 127.0.0.1:18080:8080 \
            -e EDFINDER_API_UPSTREAM=127.0.0.1:8000 "$IMAGE"
          trap 'docker logs web-smoke || true; docker rm -f web-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o page.html; then break; fi
            sleep 1
          done
          count="$(grep -o "name=\"edfinder-build-sha\" content=\"$SHA\"" page.html | wc -l)"
          [ "$count" -eq 1 ] || { echo "page does not carry build $SHA exactly once" >&2; exit 1; }
          # An unknown page must fall back to the app, not a 404.
          curl -fsS http://127.0.0.1:18080/plan -o /dev/null
          echo "web image serves the app for build $SHA"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EXACT: ${{ steps.meta.outputs.exact }}
          MOVING: ${{ steps.meta.outputs.moving }}
        run: |
          set -euo pipefail
          docker push "$EXACT"
          docker push "$MOVING"
