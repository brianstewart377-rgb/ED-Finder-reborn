# The Raspberry Pi's settings for the tools in /opt/edfinder: the deploy tool
# (edfinder_deploy.py), the nightly galaxy update (galaxy_update.py) and the
# state refresh (state_refresh.py). Copied to /opt/edfinder/deploy.conf.
# KEY=VALUE lines. No secrets belong here.
#
# Everything not named keeps the tools' own defaults, which are the current
# server's and fit the Pi too: the same database container, user and name,
# the live address 127.0.0.1:58080, and the image names.

# The Docker network the database and Redis are on (postgres.yml makes it).
EDFINDER_NETWORK=edfinder

# The API's settings file, written by scripts/pi/make_api_env.py.
EDFINDER_API_ENV_FILE=/etc/edfinder/api.env

# Only the Cloudflare Tunnel reaches the web container, so it takes each
# visitor's address from Cloudflare's own header.
EDFINDER_CLIENT_ADDRESS_FROM=cf_connecting_ip

# Until ed-finder.app points at the Pi, a deploy does not check it (it would
# be checking the current server). Remove this line after the switch.
EDFINDER_PUBLIC_ORIGIN=

# Downloads from Spansh, on the 2 TB drive rather than the boot drive.
EDFINDER_GALAXY_DIR=/srv/data/galaxy
EDFINDER_REFRESH_DIR=/srv/data/state

# New scores after each galaxy update stay off until keeping the 500 ly reach
# up to date is built: until then they would score systems far outside it.
EDFINDER_GALAXY_SCORES=off
